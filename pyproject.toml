[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-server"
version = "0.1.0"
description = "Simple VLM inference service for a single H100 GPU."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.2,<1.0.0",
    "uvicorn>=0.40.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pillow>=10.0.0,<12.0.0",
]

[tool.setuptools]
packages = ["app"]
